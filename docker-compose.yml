name: bhidubot

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bhidubot
      POSTGRES_PASSWORD: bhidubot
      POSTGRES_DB: bhidubot
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhidubot -d bhidubot"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:2.3.0
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /data
      FLOCI_DEFAULT_REGION: us-east-1
    volumes:
      - floci-data:/data
    healthcheck:
      # The image has no curl; probe with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_localstack/health HTTP/1.0\r\n\r\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Linux hosts with an NVIDIA GPU only. On Windows, run Ollama natively (spec 6.7).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres-data:
  floci-data:
  ollama-data:
